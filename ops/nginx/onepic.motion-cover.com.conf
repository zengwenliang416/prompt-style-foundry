server {
    listen 80;
    server_name onepic.motion-cover.com;

    location ~ /\.(git|env|htaccess|DS_Store) {
        deny all;
        return 404;
    }

    location ~ (^|/)\._ {
        deny all;
        return 404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name onepic.motion-cover.com;

    root /var/www/onepic-template-studio/current;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/onepic.motion-cover.com.crt;
    ssl_certificate_key /etc/nginx/ssl/onepic.motion-cover.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/onepic.motion-cover.com.access.log;
    error_log /var/log/nginx/onepic.motion-cover.com.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    location ~ /\.(git|env|htaccess|DS_Store) {
        deny all;
        return 404;
    }

    location ~ (^|/)\._ {
        deny all;
        return 404;
    }

    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(json|txt|js|css)$ {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(webp|svg)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
