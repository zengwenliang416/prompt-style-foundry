clone:
  git:
    image: woodpeckerci/plugin-git:2.10.0
    settings:
      partial: false
      depth: 0

labels:
  location: production-80

when:
  - event: manual

concurrency:
  limit: 1
  group: onepic-template-studio-production-80

steps:
  - name: verify-and-package
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    commands:
      - apt-get update
      - DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends python3 python3-venv postgresql-16 postgresql-client-16
      - chown -R pwuser:pwuser "$CI_WORKSPACE"
      - runuser -u pwuser -- bash -lc 'cd "$CI_WORKSPACE" && python3 -m venv .tmp/ci-venv && . .tmp/ci-venv/bin/activate && python3 -m pip install --no-cache-dir -r requirements-dev.txt && npm ci && CI=true ONEPIC_PG_BIN=/usr/lib/postgresql/16/bin bash scripts/ci-verify.sh && bash scripts/package-site.sh .tmp/onepic-template-studio.tar.gz'
  - name: deploy-production
    image: alpine:3.22
    environment:
      DEPLOY_HOST:
        from_secret: deploy_host
      DEPLOY_PORT:
        from_secret: deploy_port
      DEPLOY_USER:
        from_secret: deploy_user
      DEPLOY_ROOT:
        from_secret: deploy_root
      DEPLOY_DOMAIN:
        from_secret: deploy_domain
      DEPLOY_SSH_PRIVATE_KEY:
        from_secret: deploy_ssh_private_key
      DEPLOY_SSH_KNOWN_HOSTS:
        from_secret: deploy_ssh_known_hosts
    commands:
      - apk add --no-cache bash curl openssh-client
      - bash ops/woodpecker/deploy.sh .tmp/onepic-template-studio.tar.gz
